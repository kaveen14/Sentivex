version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentivex_db
    environment:
      POSTGRES_USER: sentivex
      POSTGRES_PASSWORD: sentivex
      POSTGRES_DB: sentivex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentivex"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentivex_api
    environment:
      DATABASE_URL: postgresql://sentivex:sentivex@postgres:5432/sentivex
      MODEL_PATH: /app/models/bert-sentiment
    ports:
      - "8000:8000"
    volumes:
      - ./backend/models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  nextjs:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentivex_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - fastapi
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: sentivex_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nextjs
      - fastapi
    restart: unless-stopped

volumes:
  postgres_data:
